services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agent_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in the environment or in a .env file beside docker-compose.yml}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-bm25}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-20}
      # Database and vector store live on the named volume so they survive restarts.
      - DATABASE_URL=sqlite+aiosqlite:////app/backend/data/platform.db
      - SYNC_DATABASE_URL=sqlite:////app/backend/data/platform.db
      - CHROMA_PATH=/app/backend/data/chroma
    volumes:
      - platform_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agent_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  platform_data:
